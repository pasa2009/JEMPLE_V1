<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>대출 점검 - 잼플 (Jample)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #FF8A3D;
      --primary-dark: #E67220;
      --brown: #8B5A2B;
      --cream: #FFF8E8;
      --border-color: #EFE6D8;
    }
    body {
      background-color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .app-frame {
      width: 100%;
      max-width: 400px;
      height: 840px;
      background-color: #FFFFFF;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 하단 내비게이션 바 스타일 */
    .nav-bar { 
      background: #FFF; 
      border-top: 1px solid var(--border-color); 
      display: flex; 
      justify-content: space-around; 
      padding: 8px 0 10px 0;
      flex-shrink: 0;
    }
    .nav-item { 
      border: none; 
      background: none; 
      flex: 1; 
      cursor: pointer; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      gap: 4px; 
    }
    .nav-icon { 
      width: 28px; 
      height: 28px; 
      object-fit: contain; 
    }
    .nav-label { 
      font-size: 11px; 
      color: #9E9E9E; 
      font-weight: 600; 
    }
    .nav-item.active .nav-label { 
      color: var(--primary); 
      font-weight: bold; 
    }
  </style>
</head>
<body>

  <div class="app-frame">
    
    <!-- 본문 스크롤 영역 -->
    <div class="content-area">
      <!-- 상단 헤더: 뒤로가기 & 로고, 우측 [대출 점검 배지] -->
      <header class="flex justify-between items-center mb-3 border-b border-[#EFE6D8] pb-3 flex-shrink-0">
        <div class="flex items-center gap-2">
          <button type="button" onclick="navToAppTab('care')" class="text-slate-400 hover:text-slate-600 text-sm font-bold pr-1">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <img src="logo.png" class="h-6 object-contain" alt="Jample">
        </div>
        <div class="flex items-center">
          <span class="text-xs font-bold text-[#8B5A2B] bg-[#FFF8E8] px-2.5 py-1 rounded-full border border-[#F5E5C9]">
            대출 점검
          </span>
        </div>
      </header>

      <!-- ==================== [STEP 1: 입력 폼 섹션] ==================== -->
      <div id="formSection" class="flex flex-col justify-between flex-1">
        <div class="space-y-3.5">
          <div>
            <div class="flex justify-between items-center text-xs font-semibold text-slate-400 mb-1">
              <span class="text-[11px] font-bold text-slate-400">STEP 1 / 2</span>
              <span class="bg-[#FFF8E8] text-[#E67220] border border-[#F5E5C9] px-2.5 py-0.5 rounded-full font-bold text-[11px]">대출 현황 입력</span>
            </div>
            
            <h1 class="text-lg font-black text-slate-900 leading-snug">
              내 대출은 안전할까요?<br>
              <span class="text-[#FF8A3D]">상환 부담 점검</span>
            </h1>
            <p class="text-xs text-slate-500 mt-1">
              소득 대비 부채 상환 비율을 측정하고 맞춤 관리 솔루션을 확인하세요.
            </p>
          </div>

          <form id="loanForm" onsubmit="handleDiagnosis(event)" class="space-y-3.5">
            <!-- 월 소득 입력 -->
            <div class="bg-[#FDFBF7] p-3.5 rounded-2xl border border-[#EFE6D8] shadow-sm">
              <label for="monthlyIncome" class="block text-xs font-bold text-[#8B5A2B] mb-1.5">
                1. 나의 월 실수령 소득
              </label>
              <div class="relative flex items-center">
                <input type="text" id="monthlyIncome" required placeholder="예: 3,500,000" oninput="formatCurrencyInput(this)"
                  class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-right pr-10 text-sm font-bold text-slate-900 focus:outline-none focus:border-[#FF8A3D]">
                <span class="absolute right-3 text-xs font-bold text-slate-400 pointer-events-none">원</span>
              </div>
            </div>

            <!-- 대출 리스트 영역 -->
            <div>
              <div class="flex justify-between items-center mb-2 px-1">
                <label class="text-xs font-bold text-[#8B5A2B]">2. 보유 중인 대출 내역</label>
                <button type="button" onclick="addLoanRow()" class="text-xs text-[#E67220] font-bold hover:underline">
                  + 대출 항목 추가
                </button>
              </div>

              <!-- 대출 항목 동적 컨테이너 -->
              <div id="loanListContainer" class="space-y-2.5">
                <div class="loan-item bg-[#FDFBF7] p-3.5 rounded-2xl border border-[#EFE6D8] relative space-y-2.5 shadow-sm">
                  <button type="button" onclick="removeLoanRow(this)" class="absolute top-2.5 right-3 text-slate-300 hover:text-rose-500 text-xs font-bold hidden delete-btn p-1">
                    ✕
                  </button>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-[10px] text-slate-500 font-medium mb-1">대출 잔액</label>
                      <div class="relative flex items-center">
                        <input type="text" name="balance" required placeholder="50,000,000" oninput="onLoanFieldChange(this)"
                          class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-right pr-7 text-xs font-bold text-slate-900 focus:outline-none focus:border-[#FF8A3D]">
                        <span class="absolute right-2 text-[10px] font-bold text-slate-400 pointer-events-none">원</span>
                      </div>
                    </div>
                    <div>
                      <label class="block text-[10px] text-slate-500 font-medium mb-1">적용 금리</label>
                      <div class="relative flex items-center">
                        <input type="number" step="0.01" name="rate" required placeholder="4.5" oninput="onLoanFieldChange(this)"
                          class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-right pr-7 text-xs font-bold text-slate-900 focus:outline-none focus:border-[#FF8A3D]">
                        <span class="absolute right-2 text-[10px] font-bold text-slate-400 pointer-events-none">%</span>
                      </div>
                    </div>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-[10px] text-slate-500 font-medium mb-1">상환 형태</label>
                      <select name="type" onchange="onTypeChange(this)"
                        class="w-full bg-white border border-slate-200 rounded-xl px-2 py-1.5 text-xs font-medium text-slate-700 focus:outline-none focus:border-[#FF8A3D] h-[34px]">
                        <option value="principal">원리금 (원금+이자)</option>
                        <option value="interest">이자만 (만기일시)</option>
                      </select>
                    </div>
                    <div>
                      <label class="block text-[10px] text-[#E67220] font-bold mb-1">이번 달 상환액</label>
                      <div class="relative flex items-center">
                        <input type="text" name="payment" required placeholder="500,000" oninput="formatCurrencyInput(this)"
                          class="w-full bg-[#FFF8E8] border border-[#FF8A3D]/40 rounded-xl px-2.5 py-1.5 text-right pr-7 text-xs font-bold text-slate-900 focus:outline-none focus:border-[#FF8A3D] h-[34px]">
                        <span class="absolute right-2 text-[10px] font-bold text-[#E67220] pointer-events-none">원</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 점검하기 버튼 -->
            <div class="pt-3 pb-2">
              <button type="submit" class="w-full py-3.5 bg-[#FF8A3D] hover:bg-[#E67220] active:scale-[0.99] text-white font-extrabold rounded-2xl shadow-md transition-all text-sm flex items-center justify-center gap-1.5">
                <span>소득 대비 대출 부담 점검하기</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- ==================== [STEP 2: 결과 리포트 섹션] ==================== -->
      <div id="resultSection" class="hidden flex-col justify-between flex-1">
        <div class="space-y-3.5">
          <div>
            <div class="flex justify-between items-center text-xs font-semibold text-slate-400 mb-1">
              <span class="text-[11px] font-bold text-slate-400">STEP 2 / 2</span>
              <span class="bg-[#FFF8E8] text-[#E67220] border border-[#F5E5C9] px-2.5 py-0.5 rounded-full font-bold text-[11px]">점검 리포트</span>
            </div>
            <h2 class="text-lg font-black text-slate-900 leading-snug">
              재무링의 대출 점검 리포트
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">
              소득 대비 부채 상환 부담과 맞춤형 개선 가이드입니다.
            </p>
          </div>

          <!-- 재무링 메시지 박스 -->
          <div id="fairyMessageBox" class="p-3.5 rounded-2xl text-xs leading-relaxed font-medium text-center border">
            <!-- 동적 메시지 삽입 -->
          </div>

          <!-- 요약 브리핑 카드 -->
          <div class="bg-[#FDFBF7] rounded-2xl p-4 border border-[#EFE6D8] space-y-2.5 shadow-sm text-xs">
            <div class="flex justify-between items-center">
              <span class="text-slate-500 font-medium">총 대출 잔액</span>
              <span class="font-bold text-slate-900" id="resTotalBalance">0 원</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-slate-500 font-medium">가중 평균 금리</span>
              <span class="font-bold text-slate-900" id="resAvgRate">0.00 %</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-slate-500 font-medium">총 월 상환액</span>
              <span class="font-bold text-slate-900" id="resTotalPayment">0 원</span>
            </div>
            <div class="border-t border-[#EFE6D8] pt-2 flex justify-between items-center">
              <span class="text-slate-500 font-medium">소득 대비 월 상환 비중</span>
              <span class="font-bold text-sm" id="resRatio">0%</span>
            </div>
          </div>

          <!-- 해결책 및 공적 지원 액션 영역 -->
          <div id="actionContainer" class="space-y-2.5">
            <!-- 동적 생성 -->
          </div>

          <!-- [B안] 은은하고 세련된 1줄 서포트 텍스트 배너 -->
          <div class="pt-1">
            <a href="https://naver.me/xM52kK1W" target="_blank" rel="noopener noreferrer"
               class="block bg-[#FFFDF9] hover:bg-[#FFF8E8] border border-[#F5E5C9] rounded-xl px-3.5 py-3 transition-colors shadow-2xs">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="text-sm">🌱</span>
                  <div>
                    <span class="text-xs font-bold text-[#8B5A2B]">전문가의 1:1 맞춤 부채 관리가 필요하신가요?</span>
                    <p class="text-[10px] text-slate-400 mt-0.5">정다운미래 전문가 코칭 안내 보기</p>
                  </div>
                </div>
                <span class="text-xs font-bold text-[#FF8A3D] ml-2">❯</span>
              </div>
            </a>
          </div>

          <!-- 하단 다시 점검하기 버튼 -->
          <div class="text-center pt-0.5 pb-2">
            <button onclick="resetForm()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-xl transition-all flex items-center justify-center">
              <span>다시 점검하기</span>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- 하단 4대 내비게이션 바 (세 번째 탭: '재무링가든' 적용) -->
    <nav class="nav-bar">
      <button class="nav-item" onclick="navToAppTab('home')">
        <img src="nav_home_off.png" class="nav-icon" alt="홈">
        <span class="nav-label">홈</span>
      </button>
      <button class="nav-item" onclick="navToAppTab('report')">
        <img src="nav_report_off.png" class="nav-icon" alt="리포트">
        <span class="nav-label">리포트</span>
      </button>
      <button class="nav-item active" onclick="navToAppTab('care')">
        <img src="nav_care_on.png" class="nav-icon" alt="재무링가든">
        <span class="nav-label">재무링가든</span>
      </button>
      <button class="nav-item" onclick="navToAppTab('my')">
        <img src="nav_my_off.png" class="nav-icon" alt="마이">
        <span class="nav-label">마이</span>
      </button>
    </nav>

  </div>

  <!-- 자바스크립트 로직 -->
  <script>
    function formatCurrencyInput(input) {
      let value = input.value.replace(/[^0-9]/g, '');
      if (value) {
        value = Number(value).toLocaleString();
      }
      input.value = value;
    }

    function parseCurrency(value) {
      if (!value) return 0;
      return parseFloat(value.toString().replace(/,/g, '')) || 0;
    }

    function calculateInterestPayment(itemElement) {
      const typeSelect = itemElement.querySelector('select[name="type"]');
      if (typeSelect.value === 'interest') {
        const balanceInput = itemElement.querySelector('input[name="balance"]');
        const rateInput = itemElement.querySelector('input[name="rate"]');
        const paymentInput = itemElement.querySelector('input[name="payment"]');

        const balance = parseCurrency(balanceInput.value);
        const rate = parseFloat(rateInput.value) || 0;

        if (balance > 0 && rate > 0) {
          const monthlyInterest = Math.floor((balance * (rate / 100)) / 12);
          paymentInput.value = monthlyInterest.toLocaleString();
        }
      }
    }

    function onLoanFieldChange(input) {
      formatCurrencyInput(input);
      const loanItem = input.closest('.loan-item');
      calculateInterestPayment(loanItem);
    }

    function onTypeChange(select) {
      const loanItem = select.closest('.loan-item');
      calculateInterestPayment(loanItem);
    }

    function addLoanRow() {
      const container = document.getElementById('loanListContainer');
      const newItem = document.createElement('div');
      newItem.className = 'loan-item bg-[#FDFBF7] p-3.5 rounded-2xl border border-[#EFE6D8] relative space-y-2.5 shadow-sm';
      newItem.innerHTML = `
        <button type="button" onclick="removeLoanRow(this)" class="absolute top-2.5 right-3 text-slate-300 hover:text-rose-500 text-xs font-bold hidden delete-btn p-1">
          ✕
        </button>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-slate-500 font-medium mb-1">대출 잔액</label>
            <div class="relative flex items-center">
              <input type="text" name="balance" required placeholder="50,000,000" oninput="onLoanFieldChange(this)"
                class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-right pr-7 text-xs font-bold text-slate-900 focus:outline-none focus:border-[#FF8A3D]">
              <span class="absolute right-2 text-[10px] font-bold text-slate-400 pointer-events-none">원</span>
            </div>
          </div>
          <div>
            <label class="block text-[10px] text-slate-500 font-medium mb-1">적용 금리</label>
            <div class="relative flex items-center">
              <input type="number" step="0.01" name="rate" required placeholder="4.5" oninput="onLoanFieldChange(this)"
                class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-right pr-7 text-xs font-bold text-slate-900 focus:outline-none focus:border-[#FF8A3D]">
              <span class="absolute right-2 text-[10px] font-bold text-slate-400 pointer-events-none">%</span>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-slate-500 font-medium mb-1">상환 형태</label>
            <select name="type" onchange="onTypeChange(this)"
              class="w-full bg-white border border-slate-200 rounded-xl px-2 py-1.5 text-xs font-medium text-slate-700 focus:outline-none focus:border-[#FF8A3D] h-[34px]">
              <option value="principal">원리금 (원금+이자)</option>
              <option value="interest">이자만 (만기일시)</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] text-[#E67220] font-bold mb-1">이번 달 상환액</label>
            <div class="relative flex items-center">
              <input type="text" name="payment" required placeholder="500,000" oninput="formatCurrencyInput(this)"
                class="w-full bg-[#FFF8E8] border border-[#FF8A3D]/40 rounded-xl px-2.5 py-1.5 text-right pr-7 text-xs font-bold text-slate-900 focus:outline-none focus:border-[#FF8A3D] h-[34px]">
              <span class="absolute right-2 text-[10px] font-bold text-[#E67220] pointer-events-none">원</span>
            </div>
          </div>
        </div>
      `;
      container.appendChild(newItem);
      updateDeleteButtons();
    }

    function removeLoanRow(button) {
      button.closest('.loan-item').remove();
      updateDeleteButtons();
    }

    function updateDeleteButtons() {
      const items = document.querySelectorAll('.loan-item');
      items.forEach((item) => {
        const delBtn = item.querySelector('.delete-btn');
        if (items.length === 1) {
          delBtn.classList.add('hidden');
        } else {
          delBtn.classList.remove('hidden');
        }
      });
    }

    function handleDiagnosis(event) {
      event.preventDefault();

      const income = parseCurrency(document.getElementById('monthlyIncome').value);
      const balances = document.querySelectorAll('input[name="balance"]');
      const rates = document.querySelectorAll('input[name="rate"]');
      const payments = document.querySelectorAll('input[name="payment"]');

      let totalBalance = 0;
      let totalPayment = 0;
      let weightedRateSum = 0;

      for (let i = 0; i < balances.length; i++) {
        const bal = parseCurrency(balances[i].value);
        const rat = parseFloat(rates[i].value) || 0;
        const pay = parseCurrency(payments[i].value);

        totalBalance += bal;
        totalPayment += pay;
        weightedRateSum += (bal * rat);
      }

      const avgRate = totalBalance > 0 ? (weightedRateSum / totalBalance) : 0;
      const ratio = income > 0 ? (totalPayment / income) * 100 : 0;

      document.getElementById('resTotalBalance').innerText = totalBalance.toLocaleString() + ' 원';
      document.getElementById('resAvgRate').innerText = avgRate.toFixed(2) + ' %';
      document.getElementById('resTotalPayment').innerText = totalPayment.toLocaleString() + ' 원';
      
      const ratioEl = document.getElementById('resRatio');
      ratioEl.innerText = ratio.toFixed(1) + ' %';

      const messageBox = document.getElementById('fairyMessageBox');
      const actionContainer = document.getElementById('actionContainer');
      actionContainer.innerHTML = '';

      if (ratio < 20) {
        ratioEl.className = 'font-bold text-sm text-emerald-600';
        messageBox.className = 'p-3.5 rounded-2xl text-xs leading-relaxed font-medium bg-emerald-50 text-emerald-900 border border-emerald-200 text-center';
        messageBox.innerHTML = '<strong>"훌륭해요!"</strong> 소득 대비 대출 상환액이 가벼워서<br>가계 재무 구조가 아주 안정적으로 유지되고 있어요.';
      } else if (ratio >= 20 && ratio < 40) {
        ratioEl.className = 'font-bold text-sm text-[#E67220]';
        messageBox.className = 'p-3.5 rounded-2xl text-xs leading-relaxed font-medium bg-[#FFF8E8] text-[#8B5A2B] border border-[#F5E5C9] text-center';
        messageBox.innerHTML = '<strong>"조금 숨이 차오르네요!"</strong> 월 소득의 상당 부분이 대출로 나가고 있어요.<br>생활비 예산을 바짝 조여볼 필요가 있어요.';
        
        actionContainer.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-900 leading-relaxed">
            <span class="font-bold">💡 추천 Action:</span> 생활비 통장을 분리하고, 고금리 대출부터 소액 추가상환을 시작해 이자 부담을 줄여보세요.
          </div>
        `;
      } else {
        ratioEl.className = 'font-bold text-sm text-rose-600';
        messageBox.className = 'p-3.5 rounded-2xl text-xs leading-relaxed font-medium bg-rose-50 text-rose-900 border border-rose-200 text-center';
        messageBox.innerHTML = '<strong>"위험 경고!"</strong> 소득 대비 대출 상환 부담이 과도해요.<br>대환대출 또는 공적 채무조정 지원을 즉시 검토하세요!';
