<!DOCTYPE html><html lang="ko"><head><base target="_top"><meta charset="utf-8"><style>body{font-family:system-ui,-apple-system,sans-serif;background:#FFF8E8;margin:0;padding:18px;color:#222}.card{max-width:450px;margin:auto;background:#fff;padding:24px;border-radius:18px;box-shadow:0 6px 24px #0001}h2{color:#E67220;margin:0 0 8px}label{font-size:13px;font-weight:700;display:block;margin-top:14px}input,textarea{box-sizing:border-box;width:100%;margin-top:6px;border:1px solid #ddd;border-radius:10px;padding:12px;font-size:15px}button{border:0;border-radius:12px;background:#FF8A3D;color:#fff;width:100%;padding:14px;font-weight:700;margin-top:18px;cursor:pointer}button:disabled{opacity:.5}.muted{font-size:12px;color:#666;line-height:1.5}.ok{background:#ecfdf5;padding:14px;border-radius:10px;margin-top:14px;white-space:pre-wrap}</style></head><body><section class="card"><h2>🌱 잼플 상담 쿠폰 신청</h2><p class="muted">접수 후 정다운미래 상담사가 쿠폰 유효성과 예약을 확인합니다. 접수 자체가 할인 승인을 의미하지 않습니다.</p><div id="form"><label>쿠폰 단계</label><input id="level" readonly><label>쿠폰 이름</label><input id="title" readonly><label>쿠폰 번호</label><input id="code" readonly><label>이름 또는 닉네임</label><input id="name" maxlength="40" placeholder="신청자 이름"><label>연락 가능한 휴대전화</label><input id="phone" inputmode="tel" placeholder="01012345678"><label>상담 희망 사항 (선택)</label><textarea id="memo" rows="3" maxlength="500"></textarea><label style="font-weight:400"><input id="consent" type="checkbox" style="width:auto;vertical-align:middle"> 접수·상담 안내를 위한 이름, 연락처, 쿠폰정보 수집·이용에 동의합니다.</label><p class="muted">개인정보는 상담 예약과 쿠폰 사용 확인에 사용되며 관리자만 접근합니다. 보관기간과 삭제 요청 경로는 운영자가 별도 고지해야 합니다.</p><button id="send" onclick="submitForm()">쿠폰 사용 신청 접수</button></div><div id="message" role="status"></div></section><script>const seed=<?= JSON.stringify(data) ?>;document.getElementById('code').value=seed.code;document.getElementById('level').value=seed.level;document.getElementById('title').value=seed.title;function submitForm(){const x=id=>document.getElementById(id),b=x('send');b.disabled=true;b.textContent='접수 중...';google.script.run.withSuccessHandler(r=>{b.disabled=false;b.textContent='쿠폰 사용 신청 접수';if(r.ok){

x('message').textContent=(r.duplicate?'이미 등록된 신청입니다.':'접수가 완료되었습니다.')+'\n접수번호: '+r.requestId+'\n접수일자: '+r.receivedDate+'\n처리상태: '+r.status+'\n잼플로 자동 복귀합니다. 창이 닫히지 않으면 잼플 창으로 이동하세요.\n상담사 확인 후 별도 안내됩니다.'}else{x('message').textContent=r.message||'접수를 완료하지 못했습니다.';}}).withFailureHandler(e=>{b.disabled=false;b.textContent='쿠폰 사용 신청 접수';x('message').textContent='접수 실패: '+e.message;}).submitCouponRequest({code:x('code').value,level:x('level').value,name:x('name').value,phone:x('phone').value,memo:x('memo').value,consent:x('consent').checked,demo:seed.demo});}</script></body></html>
