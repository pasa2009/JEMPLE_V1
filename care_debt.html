<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>대출 점검 - 잼플 (Jample)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    [hidden] { display: none !important; }
    :root {
      --primary: #FF8A3D;
      --primary-dark: #E67220;
      --brown: #8B5A2B;
      --cream: #FFF8E8;
      --border-color: #EFE6D8;
    }
    body {
      background-color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    .app-frame {
      width: 100%;
      max-width: 400px;
      height: 840px;
      background-color: #FFFFFF;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 하단 내비게이션 바 스타일 */
    .nav-bar { 
      background: #FFF; 
      border-top: 1px solid var(--border-color); 
      display: flex; 
      justify-content: space-around; 
      padding: 8px 0 10px 0;
      flex-shrink: 0;
    }
    .nav-item { 
      border: none; 
      background: none; 
      flex: 1; 
      cursor: pointer; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      gap: 4px; 
    }
    .nav-icon { 
      width: 28px; 
      height: 28px; 
      object-fit: contain; 
    }
    .nav-label { 
      font-size: 11px; 
      color: #9E9E9E; 
      font-weight: 600; 
    }
    .nav-item.active .nav-label { 
      color: var(--primary); 
      font-weight: bold; 
    }
  </style>
</head>
<body>

      </header>

      <!-- ==================== [STEP 1: 입력 폼 섹션] ==================== -->

                <span class="absolute right-3 text-xs font-bold text-slate-400 pointer-events-none">원</span>

            <!-- 대출 리스트 영역 -->

                      </div>
                    </div>
                    <div>
                      <label class="block text-[10px] text-slate-500 font-medium mb-1">적용 금리</label>
                      <div class="relative flex items-center">
                        <input type="number" min="0" step="0.01" name="rate" required placeholder="4.5" oninput="onLoanFieldChange(this)"
                          class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-right pr-7 text-xs font-bold text-slate-900 focus:outline-none focus:border-[#FF8A3D]">
                        <span class="absolute right-2 text-[10px] font-bold text-slate-400 pointer-events-none">%</span>
                      </div>
                    </div>
                  </div>
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-[10px] text-slate-500 font-medium mb-1">상환 형태</label>
                      <select name="type" onchange="onTypeChange(this)"
                        class="w-full bg-white border border-slate-200 rounded-xl px-2 py-1.5 text-xs font-medium text-slate-700 focus:outline-none focus:border-[#FF8A3D] h-[34px]">

                        <option value="interest">이자만 (만기일시)</option>
                      </select>
                    </div>
                    <div>
                      <label class="block text-[10px] text-[#E67220] font-bold mb-1">다음 회차 예상 상환액</label>
                      <div class="relative flex items-center">
                        <input type="text" name="payment" required readonly placeholder="자동 계산"
                          class="w-full bg-[#FFF8E8] border border-[#FF8A3D]/40 rounded-xl px-2.5 py-1.5 text-right pr-7 text-xs font-bold text-slate-900 focus:outline-none focus:border-[#FF8A3D] h-[34px]">
                        <span class="absolute right-2 text-[10px] font-bold text-[#E67220] pointer-events-none">원</span>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 점검하기 버튼 -->
            <div class="pt-3 pb-2">
              <button type="button" onclick="handleDiagnosis(event)" class="w-full py-3.5 bg-[#FF8A3D] hover:bg-[#E67220] active:scale-[0.99] text-white font-extrabold rounded-2xl shadow-md transition-all text-sm flex items-center justify-center gap-1.5">
                <span>소득 대비 대출 부담 점검하기</span>
                <i class="fa-solid fa-arrow-right text-xs"></i>
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- ==================== [STEP 2: 결과 리포트 섹션] ==================== -->
      <div id="resultSection" class="hidden flex-col justify-between flex-1">
        <div class="space-y-3.5">
          <div>
            <div class="flex justify-between items-center text-xs font-semibold text-slate-400 mb-1">
              <span class="text-[11px] font-bold text-slate-400">STEP 2 / 2</span>
              <span class="bg-[#FFF8E8] text-[#E67220] border border-[#F5E5C9] px-2.5 py-0.5 rounded-full font-bold text-[11px]">점검 리포트</span>
            </div>
            <h2 class="text-lg font-black text-slate-900 leading-snug">
              재무링의 대출 점검 리포트
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">
              소득 대비 부채 상환 부담과 맞춤형 개선 가이드입니다.
            </p>
          </div>

          <!-- 재무링 메시지 박스 -->
          <div id="fairyMessageBox" class="p-3.5 rounded-2xl text-xs leading-relaxed font-medium text-center border">
            <!-- 동적 메시지 삽입 -->
          </div>

          <!-- 요약 브리핑 카드 -->
          <div class="bg-[#FDFBF7] rounded-2xl p-4 border border-[#EFE6D8] space-y-2.5 shadow-sm text-xs">
            <div class="flex justify-between items-center">
              <span class="text-slate-500 font-medium">총 대출 잔액</span>
              <span class="font-bold text-slate-900" id="resTotalBalance">0 원</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-slate-500 font-medium">가중 평균 금리</span>
              <span class="font-bold text-slate-900" id="resAvgRate">0.00 %</span>
            </div>
            <div class="flex justify-between items-center">
              <span class="text-slate-500 font-medium">총 월 상환액</span>
              <span class="font-bold text-slate-900" id="resTotalPayment">0 원</span>
            </div>
            <div class="border-t border-[#EFE6D8] pt-2 flex justify-between items-center">
              <span class="text-slate-500 font-medium">소득 대비 월 상환 비중</span>
              <span class="font-bold text-sm" id="resRatio">0%</span>
            </div>
          </div>

          <!-- 해결책 및 공적 지원 액션 영역 -->
          <div id="actionContainer" class="space-y-2.5">
            <!-- 동적 생성 -->
          </div>

          <!-- [B안] 은은하고 세련된 1줄 서포트 텍스트 배너 -->
          <div class="pt-1">
            <a href="https://naver.me/xM52kK1W" target="_blank" rel="noopener noreferrer"
               class="block bg-[#FFFDF9] hover:bg-[#FFF8E8] border border-[#F5E5C9] rounded-xl px-3.5 py-3 transition-colors shadow-2xs">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="text-sm">🌱</span>
                  <div>
                    <span class="text-xs font-bold text-[#8B5A2B]">전문가의 1:1 맞춤 부채 관리가 필요하신가요?</span>
                    <p class="text-[10px] text-slate-400 mt-0.5">정다운미래 전문가 코칭 안내 보기</p>
                  </div>
                </div>
                <span class="text-xs font-bold text-[#FF8A3D] ml-2">❯</span>
              </div>
            </a>
          </div>

          <!-- 하단 다시 점검하기 버튼 -->
          <div class="text-center pt-0.5 pb-2">
            <button onclick="resetForm()" class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-xl transition-all flex items-center justify-center">
              <span>다시 점검하기</span>
            </button>
          </div>
        </div>
      </div>

    </div>

    <!-- 하단 4대 내비게이션 바 (세 번째 탭: '재무링가든' 적용) -->
    <nav class="nav-bar">
      <button class="nav-item" onclick="navToAppTab('home')">
        <img src="nav_home_off.png" class="nav-icon" alt="홈">
        <span class="nav-label">홈</span>
      </button>
      <button class="nav-item" onclick="navToAppTab('report')">
        <img src="nav_report_off.png" class="nav-icon" alt="리포트">
        <span class="nav-label">리포트</span>
      </button>
      <button class="nav-item active" onclick="navToAppTab('care')">
        <img src="nav_care_on.png" class="nav-icon" alt="재무링가든">
        <span class="nav-label">재무링가든</span>
      </button>
      <button class="nav-item" onclick="navToAppTab('my')">
        <img src="nav_my_off.png" class="nav-icon" alt="마이">
        <span class="nav-label">마이</span>
      </button>
    </nav>

  </div>

  <!-- 자바스크립트 로직 -->
  <script src="jample-diagnosis-reward-bridge.js"></script>
  <script>
    function formatCurrencyInput(input) {
      let value = input.value.replace(/[^0-9]/g, '');
      if (value) {
        value = Number(value).toLocaleString();
      }
      input.value = value;
    }

    function parseCurrency(value) {
      if (!value) return 0;
      return parseFloat(value.toString().replace(/,/g, '')) || 0;
    }

    // 현재 잔액과 잔여 기간 기준, 다음 1회 납입 예상액 (연금리 / 12).
    function computeLoanPayment(balance, annualRate, months, type) {
      if (!Number.isFinite(balance) || balance <= 0 || !Number.isFinite(annualRate) || annualRate < 0) return null;
      const r = annualRate / 1200;
      if (type !== 'interest' && (!Number.isInteger(months) || months < 1)) return null;
      const rawPayment = type === 'interest' ? balance * r :
        (r === 0 ? balance / months : balance * r / -Math.expm1(-months * Math.log1p(r)));
      if (!Number.isFinite(rawPayment)) return null;
      const interest = Math.round(balance * r);
      const payment = Math.round(rawPayment);
      return { payment, interest, principal: Math.max(0, payment - interest) };
    }

    function koreaToday() {
      return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul' }).format(new Date());
    }

    // 매월 시작일과 같은 일자. 해당 일이 없는 달에는 말일로 조정.
    function dueDate(start, offset) {
      const [y, m, d] = start.split('-').map(Number);
      const first = new Date(Date.UTC(y, m - 1 + offset, 1));
      const last = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
      return [first.getUTCFullYear(), String(first.getUTCMonth() + 1).padStart(2, '0'), String(Math.min(d, last)).padStart(2, '0')].join('-');
    }

    function computeLoanAsOf(principal, rate, months, start, today) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(start) || dueDate(start, 0) !== start || start > today) return null;
      const base = computeLoanPayment(principal, rate, months, 'principal');
      if (!base || months > 1200) return null;
      const [y, m] = start.split('-').map(Number);
      const [ty, tm] = today.split('-').map(Number);
      let paid = Math.min(months, Math.max(0, (ty - y) * 12 + tm - m));
      if (paid > 0 && dueDate(start, paid) > today) paid--;
      const r = rate / 1200;
      const fixed = r === 0 ? principal / months : principal * r / -Math.expm1(-months * Math.log1p(r));
      // 잔여 연금의 현재가치로 잔액 계산: 긴 기간에도 안정적으로 계산.
      const balance = paid >= months ? 0 : (r === 0 ? fixed * (months - paid) : fixed * -Math.expm1(-(months - paid) * Math.log1p(r)) / r);
      const interest = Math.round(balance * r);
      const payment = Math.round(Math.min(fixed, balance * (1 + r)));
      return { balance: Math.round(balance), interest, payment, principal: Math.max(0, payment - interest), paid,
        next: paid < months ? dueDate(start, paid + 1) : null };
    }

    function initializeLoanRow(item) {
      if (item.querySelector('[name="months"]')) return;
      const select = item.querySelector('[name="type"]');
      const selectorBlock = select.parentElement;
      item.insertBefore(selectorBlock, item.querySelector('.grid'));
      const balance = item.querySelector('[name="balance"]');
      balance.parentElement.previousElementSibling.setAttribute('data-balance-label', '');
      const extra = document.createElement('div');
      extra.innerHTML = `
        <div data-principal-fields class="grid grid-cols-2 gap-2">
          <label class="block text-xs text-slate-500">대출 시작일
            <input type="date" name="startDate" required max="${koreaToday()}" oninput="onLoanFieldChange(this)"
              class="w-full bg-white border border-slate-200 rounded-xl px-2 py-2 mt-1">
          </label>
          <label class="block text-xs text-slate-500">전체 상환기간 (개월)
            <input type="number" name="months" min="1" max="1200" step="1" required placeholder="예: 360 (30년)"
              oninput="onLoanFieldChange(this)" class="w-full bg-white border border-slate-200 rounded-xl px-2 py-2 mt-1">
          </label>
        </div>
        <p class="text-xs font-bold text-[#8B5A2B] mt-2" aria-live="polite" data-current-balance></p>
        <p class="text-xs text-slate-600 mt-2" aria-live="polite" data-breakdown>원금 — · 이자 —</p>
        <p class="text-[10px] text-slate-500 mt-1" data-calculation-note></p>`;
      item.appendChild(extra);
      calculateInterestPayment(item);
    }

    function calculateInterestPayment(itemElement) {
      const interestOnly = itemElement.querySelector('[name="type"]').value === 'interest';
      const term = itemElement.querySelector('[name="months"]');
      if (!term) return null;
      const start = itemElement.querySelector('[name="startDate"]');
      for (const input of [term, start]) { input.required = !interestOnly; input.disabled = interestOnly; }
      itemElement.querySelector('[data-principal-fields]').hidden = interestOnly;
      itemElement.querySelector('[data-balance-label]').textContent = interestOnly ? '현재 대출 잔액' : '최초 대출원금';
      const rateInput = itemElement.querySelector('[name="rate"]');
      const amount = parseCurrency(itemElement.querySelector('[name="balance"]').value);
      const today = koreaToday();
      const result = rateInput.value.trim() === '' ? null : (interestOnly ?
        computeLoanPayment(amount, Number(rateInput.value), 0, 'interest') :
        computeLoanAsOf(amount, Number(rateInput.value), Number(term.value), start.value, today));
      if (result && interestOnly) result.balance = amount;
      itemElement.loanResult = result;
      const payment = itemElement.querySelector('[name="payment"]');
      payment.value = result ? result.payment.toLocaleString('ko-KR') : '';
      const won = n => n.toLocaleString('ko-KR') + '원';
      const balanceText = itemElement.querySelector('[data-current-balance]');
      balanceText.hidden = interestOnly;
      balanceText.textContent = result ? today + ' 기준 예상 잔액: ' + won(result.balance) : '필요한 정보를 입력하면 자동 계산됩니다.';
      itemElement.querySelector('[data-breakdown]').hidden = interestOnly;
      itemElement.querySelector('[data-breakdown]').textContent = result ? '원금 ' + won(result.principal) + ' · 이자 ' + won(result.interest) : '원금 — · 이자 —';
      const note = itemElement.querySelector('[data-calculation-note]');
      note.hidden = interestOnly;
      note.textContent = '실제 은행잔액과 다를 수 있음';
      return result;
    }

    function onLoanFieldChange(input) {
      if (input.name === 'balance') formatCurrencyInput(input);
      calculateInterestPayment(input.closest('.loan-item'));
    }

    function onTypeChange(select) {
      calculateInterestPayment(select.closest('.loan-item'));
    }

    function addLoanRow() {
      const container = document.getElementById('loanListContainer');
      const newItem = document.createElement('div');
      newItem.className = 'loan-item bg-[#FDFBF7] p-3.5 rounded-2xl border border-[#EFE6D8] relative space-y-2.5 shadow-sm';
      newItem.innerHTML = `
        <button type="button" onclick="removeLoanRow(this)" class="absolute top-2.5 right-3 text-slate-300 hover:text-rose-500 text-xs font-bold hidden delete-btn p-1">
          ✕
        </button>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-slate-500 font-medium mb-1">대출 잔액</label>
            <div class="relative flex items-center">
              <input type="text" name="balance" required placeholder="50,000,000" oninput="onLoanFieldChange(this)"
                class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-right pr-7 text-xs font-bold text-slate-900 focus:outline-none focus:border-[#FF8A3D]">
              <span class="absolute right-2 text-[10px] font-bold text-slate-400 pointer-events-none">원</span>
            </div>
          </div>
          <div>
            <label class="block text-[10px] text-slate-500 font-medium mb-1">적용 금리</label>
            <div class="relative flex items-center">
              <input type="number" min="0" step="0.01" name="rate" required placeholder="4.5" oninput="onLoanFieldChange(this)"
                class="w-full bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 text-right pr-7 text-xs font-bold text-slate-900 focus:outline-none focus:border-[#FF8A3D]">
              <span class="absolute right-2 text-[10px] font-bold text-slate-400 pointer-events-none">%</span>
            </div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] text-slate-500 font-medium mb-1">상환 형태</label>
            <select name="type" onchange="onTypeChange(this)"
              class="w-full bg-white border border-slate-200 rounded-xl px-2 py-1.5 text-xs font-medium text-slate-700 focus:outline-none focus:border-[#FF8A3D] h-[34px]">
              <option value="principal">원리금균등상환</option>
              <option value="interest">이자만 (만기일시)</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] text-[#E67220] font-bold mb-1">다음 회차 예상 상환액</label>
            <div class="relative flex items-center">
              <input type="text" name="payment" required readonly placeholder="자동 계산"
                class="w-full bg-[#FFF8E8] border border-[#FF8A3D]/40 rounded-xl px-2.5 py-1.5 text-right pr-7 text-xs font-bold text-slate-900 focus:outline-none focus:border-[#FF8A3D] h-[34px]">
              <span class="absolute right-2 text-[10px] font-bold text-[#E67220] pointer-events-none">원</span>
            </div>
          </div>
        </div>
      `;
      container.appendChild(newItem);
      initializeLoanRow(newItem);
      updateDeleteButtons();
    }

    function removeLoanRow(button) {
      button.closest('.loan-item').remove();
      updateDeleteButtons();
    }

    function updateDeleteButtons() {
      const items = document.querySelectorAll('.loan-item');
      items.forEach((item) => {
        const delBtn = item.querySelector('.delete-btn');
        if (items.length === 1) {
          delBtn.classList.add('hidden');
        } else {
          delBtn.classList.remove('hidden');
        }
      });
    }

    function handleDiagnosis(event) {
      event.preventDefault();
      // 자동 계산 필드를 제외하고 실제 입력 항목의 오류를 명시한다.
      const form = document.getElementById('loanForm');
      for (const input of form.querySelectorAll('input:not([readonly]):not(:disabled)')) {
        if (!input.checkValidity()) {
          input.reportValidity();
          input.focus();
          return;
        }
      }

      for (const item of document.querySelectorAll('.loan-item')) {
        if (!calculateInterestPayment(item)) {
          alert('대출원금(또는 현재 잔액), 연금리, 대출 시작일과 전체 상환기간을 확인해주세요.');
          return;
        }
      }
      const income = parseCurrency(document.getElementById('monthlyIncome').value);
      if (income <= 0) { alert('월 실수령 소득을 1원 이상 입력해주세요.'); return; }
      const balances = document.querySelectorAll('input[name="balance"]');
      const rates = document.querySelectorAll('input[name="rate"]');
      const payments = document.querySelectorAll('input[name="payment"]');

      let totalBalance = 0;
      let totalPayment = 0;
      let weightedRateSum = 0;

      for (let i = 0; i < balances.length; i++) {
        const bal = balances[i].closest('.loan-item').loanResult.balance;
        const rat = parseFloat(rates[i].value) || 0;
        const pay = parseCurrency(payments[i].value);

        totalBalance += bal;
        totalPayment += pay;
        weightedRateSum += (bal * rat);
      }

      const avgRate = totalBalance > 0 ? (weightedRateSum / totalBalance) : 0;
      const ratio = income > 0 ? (totalPayment / income) * 100 : 0;

      document.getElementById('resTotalBalance').innerText = totalBalance.toLocaleString() + ' 원';
      document.getElementById('resAvgRate').innerText = avgRate.toFixed(2) + ' %';
      document.getElementById('resTotalPayment').innerText = totalPayment.toLocaleString() + ' 원';
      
      const ratioEl = document.getElementById('resRatio');
      ratioEl.innerText = ratio.toFixed(1) + ' %';

      const messageBox = document.getElementById('fairyMessageBox');
      const actionContainer = document.getElementById('actionContainer');
      actionContainer.innerHTML = '';

      if (ratio < 20) {
        ratioEl.className = 'font-bold text-sm text-emerald-600';
        messageBox.className = 'p-3.5 rounded-2xl text-xs leading-relaxed font-medium bg-emerald-50 text-emerald-900 border border-emerald-200 text-center';
        messageBox.innerHTML = '<strong>"훌륭해요!"</strong> 소득 대비 대출 상환액이 가벼워서<br>가계 재무 구조가 아주 안정적으로 유지되고 있어요.';
      } else if (ratio >= 20 && ratio < 40) {
        ratioEl.className = 'font-bold text-sm text-[#E67220]';
        messageBox.className = 'p-3.5 rounded-2xl text-xs leading-relaxed font-medium bg-[#FFF8E8] text-[#8B5A2B] border border-[#F5E5C9] text-center';
        messageBox.innerHTML = '<strong>"조금 숨이 차오르네요!"</strong> 월 소득의 상당 부분이 대출로 나가고 있어요.<br>생활비 예산을 바짝 조여볼 필요가 있어요.';
        
        actionContainer.innerHTML = `
          <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-900 leading-relaxed">
            <span class="font-bold">💡 추천 Action:</span> 생활비 통장을 분리하고, 고금리 대출부터 소액 추가상환을 시작해 이자 부담을 줄여보세요.
          </div>
        `;
      } else {
        ratioEl.className = 'font-bold text-sm text-rose-600';
        messageBox.className = 'p-3.5 rounded-2xl text-xs leading-relaxed font-medium bg-rose-50 text-rose-900 border border-rose-200 text-center';
        messageBox.innerHTML = '<strong>"위험 경고!"</strong> 소득 대비 대출 상환 부담이 과도해요.<br>대환대출 또는 공적 채무조정 지원을 즉시 검토하세요!';
        
        actionContainer.innerHTML = `
          <div class="space-y-2">
            <div class="bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs text-amber-900 leading-relaxed">
              <span class="font-bold">💡 추천 Action:</span> 월 상환액을 줄이기 위한 대환대출/거치기간 조정 및 긴급 지출 다이어트가 시급합니다.
            </div>
            <div class="bg-rose-50 border border-rose-200 rounded-xl p-3 space-y-1.5">
              <p class="text-[11px] font-bold text-rose-900 text-center">🏛️ 공적 채무조정 및 법률 구제 지원</p>
              <a href="https://www.ccrs.or.kr" target="_blank" rel="noopener noreferrer" class="block w-full bg-white hover:bg-rose-100/50 text-rose-700 border border-rose-300 font-semibold py-2 px-3 rounded-lg text-xs text-center transition shadow-2xs">
                신용회복위원회 (개인/프리워크아웃) 바로가기 ➔
              </a>
              <a href="https://www.helplaw24.go.kr" target="_blank" rel="noopener noreferrer" class="block w-full bg-white hover:bg-rose-100/50 text-rose-700 border border-rose-300 font-semibold py-2 px-3 rounded-lg text-xs text-center transition shadow-2xs">
                서민금융통합지원센터 (채무조정·회생) 바로가기 ➔
              </a>
            </div>
          </div>
        `;
      }

      document.getElementById('formSection').hidden = true;
      document.getElementById('resultSection').hidden = false;
      document.getElementById('formSection').classList.add('hidden');
      document.getElementById('resultSection').classList.remove('hidden');
      document.getElementById('resultSection').classList.add('flex');
       // 결과 화면 완성 후 월 1회 진단 보상 이벤트 발행
       window.JampleDiagnosisReward?.complete('debt');
    }

    function resetForm() {
      document.getElementById('loanForm').reset();
      document.querySelectorAll('.loan-item').forEach(calculateInterestPayment);
      document.getElementById('resultSection').hidden = true;
      document.getElementById('formSection').hidden = false;
      document.getElementById('resultSection').classList.add('hidden');
      document.getElementById('resultSection').classList.remove('flex');
      document.getElementById('formSection').classList.remove('hidden');
      document.getElementById('formSection').classList.add('flex');
    }

    function navToAppTab(tabName) {
      const params = new URLSearchParams(window.location.search);
       const target = new URL('index.html', window.location.href);
       target.searchParams.set('tab', tabName);
       if (params.get('demo') === '1') target.searchParams.set('demo', '1');
       if (params.get('testDate')) target.searchParams.set('testDate', params.get('testDate'));
       window.location.href = target.toString();
    }
    document.querySelectorAll('.loan-item').forEach(initializeLoanRow);
  </script>
</body>
</html>
